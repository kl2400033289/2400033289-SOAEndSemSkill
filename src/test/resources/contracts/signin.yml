request:
  method: POST
  url: /ms1/signin
  headers:
    Content-Type: application/json
  body:
    username: "admin"
    password: "admin123"

response:
  status: 200
  headers:
    Content-Type: application/json
  body:
    token: "sample-token"
  matchers:
    body:
      - path: $.token
        type: by_regex
        predefined: non_empty